<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="div">
      <div
        class="search-wrapper1"
        data-qa="big"
      >
        <a
          href="images/Search.svg"
          class="search-logo1"
          alt="search logo"
        ></a>
        <input
          class="input1"
          type="text"
          data-qa="keypress"
          placeholder="Try &ldquo;Los Angeles&rdquo;"
        />
      </div>

      <div
        class="search-wrapper2"
        data-qa="small"
      >
        <a
          href="images/Search.svg"
          class="search-logo2"
          alt="search logo"
        ></a>
        <input
          class="input2"
          type="text"
          data-qa="hover"
          placeholder="Try &ldquo;Los Angeles&rdquo;"
        />
      </div>
    </div>
  </body>
</html>

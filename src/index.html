<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="container">
      <form
        class="search-wrapper search-wrapper--large"
        data-qa="big"
      >
        <span class="search-wrapper__icon search-wrapper__icon--large"></span>
        <input
          class="search-wrapper__input search-wrapper__input--large"
          type="text"
          data-qa="keypress"
          placeholder="Try &ldquo;Los Angeles&rdquo;"
        />
      </form>

      <form
        class="search-wrapper search-wrapper--small"
        data-qa="small"
      >
        <span class="search-wrapper__icon search-wrapper__icon--small"></span>
        <input
          class="search-wrapper__input search-wrapper__input--small"
          type="text"
          data-qa="hover"
          placeholder="Try &ldquo;Los Angeles&rdquo;"
        />
      </form>
    </div>
  </body>
</html>
